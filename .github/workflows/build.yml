name: Build installer

# Builds AudensCut from a tag of the private source repo and publishes the
# Windows installer as a release in this repo. Installed copies of AudensCut
# check these releases and update themselves.
#
# Run by hand: Actions → Build installer → Run workflow, with the tag
# (e.g. v0.1.2). The tag must match apps/electron/package.json.
#
# Needs the AUDENSCUT_DEPLOY_KEY secret: the private half of a read-only
# deploy key added to the source repo. Public repos build for free.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in the source repo, e.g. v0.1.2"
        required: true

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: audenscompanyprojects-beep/AudensCut
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.AUDENSCUT_DEPLOY_KEY }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check the tag matches the app version
        run: |
          version="v$(node -p "require('./apps/electron/package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match apps/electron/package.json ($version)"
            exit 1
          fi

      - name: Install
        run: |
          (cd apps/web && bun install --frozen-lockfile)
          (cd apps/electron && bun install --frozen-lockfile)

      - name: Check the editor
        working-directory: apps/web
        run: |
          bun run typecheck
          bun test

      - name: Build the installer
        working-directory: apps/electron
        env:
          # Optional: Freesound API key for the sound library (empty = not set).
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          bun run build:web
          bun run copy:web
          node node_modules/electron-builder/cli.js --win --x64 --publish never

      # Published with gh and tied to this repo. electron-builder would point
      # the release at the source commit, which does not exist here (422).
      # All three files are needed: latest.yml is what installed apps read.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          dist="apps/electron/dist"
          sha="$(sha256sum "$dist/AudensCut-Setup-$version.exe" | cut -c1-64)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main \
            --title "AudensCut $version" \
            --notes "Instalador do AudensCut $version para Windows (64 bits). Quem já tem o AudensCut instalado recebe esta versão sozinho. SHA-256 do instalador: $sha" \
            "$dist/AudensCut-Setup-$version.exe" \
            "$dist/AudensCut-Setup-$version.exe.blockmap" \
            "$dist/latest.yml"
